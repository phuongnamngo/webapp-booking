# One password for URL + Postgres. If you change it after the volume was
# initialized, run: docker compose down -v
services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      sql:
    ports:
      - "127.0.0.1:8080:8080"
    # Keep app private; nginx on host proxies to localhost:8080
    environment:
      POSTGRES_URL: postgres://seatsurfing:${POSTGRES_PASSWORD}@db/seatsurfing?sslmode=disable
      CRYPT_KEY: ${CRYPT_KEY}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      PUBLIC_PORT: "${PUBLIC_PORT:-8080}"
      PUBLIC_LISTEN_ADDR: 0.0.0.0:8080
      INIT_ORG_DOMAIN: ${INIT_ORG_DOMAIN:-localhost}
      INIT_ORG_USER: ${INIT_ORG_USER:-admin}
      INIT_ORG_PASS: ${INIT_ORG_PASS:-Sea!surf1ng}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAIL_SERVICE: ${MAIL_SERVICE:-smtp}
      MAIL_SENDER_ADDRESS: ${MAIL_SENDER_ADDRESS:-no-reply@localhost}
      SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      SMTP_PORT: "${SMTP_PORT:-25}"
      SMTP_START_TLS: ${SMTP_START_TLS:-0}
      SMTP_INSECURE_SKIP_VERIFY: ${SMTP_INSECURE_SKIP_VERIFY:-0}
      SMTP_AUTH: ${SMTP_AUTH:-0}
      SMTP_AUTH_USER: ${SMTP_AUTH_USER:-}
      SMTP_AUTH_PASS: ${SMTP_AUTH_PASS:-}
      SMTP_AUTH_METHOD: ${SMTP_AUTH_METHOD:-PLAIN}
      DAILY_BOOKING_REPORT_ENABLED: ${DAILY_BOOKING_REPORT_ENABLED:-0}
      DAILY_BOOKING_REPORT_RECIPIENTS: ${DAILY_BOOKING_REPORT_RECIPIENTS:-}
  db:
    image: postgres:17
    restart: always
    networks:
      sql:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: seatsurfing
      POSTGRES_DB: seatsurfing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatsurfing -d seatsurfing"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  db:

networks:
  sql:
