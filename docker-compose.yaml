# One password for URL + Postgres. If you change it after the volume was
# initialized, run: docker compose down -v
services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      sql:
    ports:
      - "127.0.0.1:8080:8080"
    # Keep app private; nginx on host proxies to localhost:8080
    environment:
      POSTGRES_URL: postgres://seatsurfing:${POSTGRES_PASSWORD}@db/seatsurfing?sslmode=disable
      CRYPT_KEY: ${CRYPT_KEY}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      PUBLIC_PORT: "${PUBLIC_PORT:-8080}"
      PUBLIC_LISTEN_ADDR: 0.0.0.0:8080
      INIT_ORG_DOMAIN: ${INIT_ORG_DOMAIN:-localhost}
      INIT_ORG_USER: ${INIT_ORG_USER:-admin}
      INIT_ORG_PASS: ${INIT_ORG_PASS:-Sea!surf1ng}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
  db:
    image: postgres:17
    restart: always
    networks:
      sql:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: seatsurfing
      POSTGRES_DB: seatsurfing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatsurfing -d seatsurfing"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  db:

networks:
  sql:
